name: Daily Weather Collect

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 08:00（北京时间）
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

# 与 star.yml 共用同一把锁：两者都会 push 到 main，
# 串行执行可避免互相顶掉（各 job 内另有 rebase 重试兜底）
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Collect & visualize
        run: python main.py --days 1

      - name: Verify README assets
        run: python verify_readme.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ output/ docs/ 全量 + README 徽章
          # 注意：docs/ 必须包含——README 里所有图片都指向它
          git add -f data/ output/ docs/ README.md
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: daily weather update $(date +%F)"
          # star.yml 也可能同时 push，被拒就 rebase 重试
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），rebase 后重试..."
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "推送最终失败"
          exit 1