name: Daily Weather Collect

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 08:00（北京时间）
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Collect & visualize
        run: python main.py --days 1

      - name: Verify README assets
        run: |
          # README 引用的本地图片必须存在，防止「日期在变、图不动」
          python - <<'PY'
          import sys
          from weather.sync import check_readme_refs
          missing = check_readme_refs()
          if missing:
              print("缺失文件:", missing)
              sys.exit(1)
          print("README 图片引用完整")
          PY

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ output/ docs/ 全量 + README 徽章
          # 注意：docs/ 必须包含——README 里所有图片都指向它
          git add -f data/ output/ docs/ README.md
          git diff --cached --quiet || git commit -m "chore: daily weather update $(date +%F)"
          git push