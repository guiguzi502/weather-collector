name: Daily Weather Collect

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 08:00（北京时间）
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

# 与 star.yml 共用同一把锁：两者都会 push 到 main，
# 串行执行可避免互相顶掉（各 job 内另有 rebase 重试兜底）
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Collect & visualize
        run: python main.py --days 1

      - name: Verify README assets
        run: python verify_readme.py

      - name: Commit results
        run: bash scripts/commit_artifacts.sh "chore: daily weather update $(date +%F)" "data/ output/ docs/ README.md"