name: Star Milestone Tracker

on:
  watch:
    types: [started]       # 有人点 Star 时触发（含 0 -> 1，可用作"首星"）
  schedule:
    - cron: "30 2 * * *"   # 每天 10:30（北京时间）兜底检查，防止漏记录
  workflow_dispatch:

permissions:
  contents: write

# 与 daily.yml 共用同一把锁：两者都会 push 到 main，
# 串行执行可避免互相顶掉（daily.yml 里另有 rebase 重试兜底）
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check star milestones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python star_milestone.py

      - name: Commit milestone
        run: |
          # 文件可能不存在（还没到首个里程碑）——先建初始文件，避免 pathspec 报错
          if [ ! -f docs/star_milestones.md ]; then
            mkdir -p docs
            printf '# ⭐ Star 里程碑\n\n记录本仓库达成的重要 Star 节点。每日 08:00 自动检查，达到即记录 🎉\n\n| 里程碑 | 达成时间 | 当时 Star 数 |\n|---|---|---|\n\n> 暂无里程碑达成（当前目标：10 ⭐）\n' > docs/star_milestones.md
            echo "已创建初始 docs/star_milestones.md"
          fi
          bash scripts/commit_artifacts.sh \
            "docs: star milestone reached $(date +%F)" \
            "docs/star_milestones.md"