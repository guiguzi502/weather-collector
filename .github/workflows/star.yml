name: Star Milestone Tracker

on:
  watch:
    types: [started]       # 有人点 Star 时触发（含 0 -> 1，可用作"首星"）
  schedule:
    - cron: "30 2 * * *"   # 每天 10:30（北京时间）兜底检查，防止漏记录
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check star milestones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python star_milestone.py

      - name: Commit milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/star_milestones.md
          git diff --cached --quiet || git commit -m "docs: star milestone reached $(date +%F)"
          git push