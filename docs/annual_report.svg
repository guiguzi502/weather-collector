3" fill="#8FA3BF">❄️ 最凉</text><text x="412" y="482" font-size="13" fill="#F2F5FA">沈阳</text><text x="592" y="482" font-size="13" fill="#6FC3FF">13.1°C</text><text x="412" y="510" font-size="13" fill="#F2F5FA">太原</text><text x="592" y="510" font-size="13" fill="#6FC3FF">13.7°C</text><text x="412" y="538" font-size="13" fill="#F2F5FA">西安</text><text x="592" y="538" font-size="13" fill="#6FC3FF">16.6°C</text><text x="40" y="580" font-size="15" font-weight="700" fill="#5B8DEF">🏮 长沙 · 太原 南北对望</text><text x="40" y="614" font-size="13" fill="#F2F5FA">· 长沙比太原暖的日子有 94 天（共 95 天）</text><text x="40" y="640" font-size="13" fill="#F2F5FA">· 温差最大一天：长沙 26.7°C vs 太原 12.7°C，差 14.0°C（10-17）</text><line x1="40" y1="686" x2="720" y2="686" stroke="#27405F" stroke-width="1"/><text x="40" y="712" font-size="12" fill="#8FA3BF">数据来自 Open-Meteo · 每日 08:00 自动更新</text><text x="40" y="730" font-size="12" fill="#E8C46A">明天，也要记得看天气 ☀️</text>
